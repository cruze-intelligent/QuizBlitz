{% extends "base.html" %}

{% block content %}
<section class="game-screen" data-session-code="{{ session_code }}" data-team-id="{{ team_id }}" data-team-name="{{ team.team_name }}">
  <div class="card question-card">
    <div class="question-meta">
      <span class="badge">Round <span id="round-number">1</span></span>
      <span class="badge badge--muted">Question <span id="question-number">1</span></span>
    </div>
    <h1 id="question-text">Waiting for the next question...</h1>
    <div id="option-list" class="option-list"></div>
    <p id="status-message" class="status-message">Waiting for game to begin.</p>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/play.js') }}"></script>
{% endblock %}
