{% extends "base.html" %}

{% block content %}
<section class="game-screen" data-session-code="{{ session_code }}" data-team-name="{{ team.team_name }}">
  <div class="card question-card">
    <div class="question-meta">
      <span class="badge">{{ team.team_name }}</span>
      <span class="badge badge--muted" id="question-label" hidden></span>
    </div>

    <div class="timer-bar" id="live-timer" role="timer" aria-label="Time remaining" hidden>
      <div class="timer-bar__track"><div class="timer-bar__fill" data-timer-fill></div></div>
      <div class="timer-display" data-timer-text></div>
    </div>

    <h1 id="question-text" class="live-question-text">You're in!</h1>
    <div id="option-list" class="option-list"></div>
    <ol id="rank-list" class="rank-list" aria-label="Team rankings" hidden></ol>
    <p id="status-message" class="status-message" role="status" aria-live="polite">Connecting…</p>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/vendor/socket.io-4.7.2.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/countdown.js') }}"></script>
<script src="{{ url_for('static', filename='js/play.js') }}"></script>
{% endblock %}
